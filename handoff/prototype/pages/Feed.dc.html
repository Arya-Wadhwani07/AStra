<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AStra · Your feed</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/astra/tokens.css">
<link rel="stylesheet" href="ds/astra/components/bundle.css">
<script src="ds/astra/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Unbounded";src:url("/_blob/9e2d0308574e0dd739947215fe78be46") format("woff2");font-weight:200 900;font-display:swap}
@font-face{font-family:"Schibsted Grotesk";src:url("/_blob/52f7db2d17ed1151fb5edc419ca9f191") format("woff2");font-weight:400 900;font-display:swap}
@font-face{font-family:"IBM Plex Mono";src:url("/_blob/e44578e499896e30b393535e412478a4") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"IBM Plex Mono";src:url("/_blob/74f0e95277624757400b58c375897663") format("woff2");font-weight:500;font-display:swap}
body{margin:0;background:#0b1430}
a{color:var(--link)}a:hover{color:var(--ink)}
</style>
</helmet>
<div onClick="{{ route }}" data-theme="glass" class="as-shell as-shell--rail" style="width: 1440px; height: 3260px; font-family: var(--font-sans); color: var(--ink); overflow: hidden">
<nav aria-hidden="true" style="display: none"><sc-for list="{{ routes }}" as="r" hint-placeholder-count="12"><a href="{{ r.file }}" data-route="{{ r.key }}" tabindex="-1">{{ r.key }}</a></sc-for></nav>
<div class="as-ambient as-ambient--drift" aria-hidden="true"><span class="as-ambient__blob as-ambient__blob--1"></span><span class="as-ambient__blob as-ambient__blob--2"></span><span class="as-ambient__blob as-ambient__blob--3"></span><span class="as-ambient__blob as-ambient__blob--4"></span><span class="as-ambient__grain"></span></div>
<x-import component-from-global-scope="AStra.SideNav" role="audience" active="feed" user="Alex Morgan" unread="{{ n2 }}" dual="{{ no }}"></x-import>
<div class="as-shell__body">
<x-import component-from-global-scope="AStra.TopBar" title="Your feed" unread="{{ n2 }}"></x-import>
<div class="as-shell__cols">
<main class="as-shell__main">
<div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center">
<x-import component-from-global-scope="AStra.Chip" interactive="{{ yes }}" selected="{{ fAll }}" on-click="{{ pickAll }}">All</x-import>
<x-import component-from-global-scope="AStra.Chip" interactive="{{ yes }}" icon="article" selected="{{ fPost }}" on-click="{{ pickPost }}">Posts</x-import>
<x-import component-from-global-scope="AStra.Chip" interactive="{{ yes }}" icon="ticket" selected="{{ fEvent }}" on-click="{{ pickEvent }}">Events</x-import>
<x-import component-from-global-scope="AStra.Chip" interactive="{{ yes }}" icon="t-shirt" selected="{{ fMerch }}" on-click="{{ pickMerch }}">Merchandise</x-import>
<span class="as-caption">From 4 favorite creators · newest first</span>
<span class="as-sample" style="margin-left: auto">Sample data</span>
</div>
<sc-if value="{{ showEvent }}" hint-placeholder-val="{{ true }}">
<x-import component-from-global-scope="AStra.FeedCard" type="event" creator="Mira Rao" discipline="painter" verified="{{ yes }}" time="2h ago" art="event" credit="Placeholder art" title="Color After Hours" body="A small evening show of new color-field work. Prints available at the door." date="Sat, Oct 10 · 6-8 PM PT" location="Los Angeles" price="{{ n25 }}" availability="available" favorite="{{ yes }}"></x-import>
</sc-if>
<sc-if value="{{ showPost }}" hint-placeholder-val="{{ true }}">
<x-import component-from-global-scope="AStra.FeedCard" type="post" text-only="{{ yes }}" creator="Priya Nair" discipline="writer" time="5h ago" title="Notes from a slow draft" body="I rewrote the opening chapter four times this month. What finally made it click: reading it aloud to the dancers I’m writing about." favorite="{{ yes }}"></x-import>
</sc-if>
<sc-if value="{{ showMerch }}" hint-placeholder-val="{{ true }}">
<x-import component-from-global-scope="AStra.FeedCard" type="merch" creator="Mira Rao" discipline="painter" verified="{{ yes }}" time="Yesterday" art="print" credit="Placeholder art" title="Chromatic Study · art print" body="Archival giclée print, 12 × 16 in. Signed on the back." price="{{ n30 }}" availability="low" count="{{ n12 }}" favorite="{{ yes }}"></x-import>
</sc-if>
<sc-if value="{{ showPost }}" hint-placeholder-val="{{ true }}">
<x-import component-from-global-scope="AStra.FeedCard" type="post" creator="Nia Brooks" discipline="dancer" time="2 days ago" art="dance" ratio="16:9" credit="Placeholder art" title="Rehearsal notes: the spiral section" body="Twelve counts, three dancers, one very patient floor. Full piece premieres in November." favorite="{{ yes }}"></x-import>
</sc-if>
<x-import component-from-global-scope="AStra.Loading" label="Loading earlier posts"><x-import component-from-global-scope="AStra.Skeleton" variant="card"></x-import></x-import>
</main>
<aside class="as-shell__rail">
<x-import component-from-global-scope="AStra.PointsBalance" available="{{ n600 }}" pending="{{ n50 }}" rule="100 pts = $1 off, up to each creator’s limit"></x-import>
<a href="Loyalty.dc.html" class="as-btn as-btn--secondary as-btn--sm" style="align-self: flex-start">Loyalty history</a>
<section class="as-card" style="display: flex; flex-direction: column; gap: 12px">
<h2 class="as-section-title" style="font-size: 16px">Favorite creators</h2>
<a href="Profile.dc.html" style="text-decoration: none; color: inherit"><x-import component-from-global-scope="AStra.CreatorSummary" compact="{{ yes }}" name="Mira Rao" discipline="painter" verified="{{ yes }}"></x-import></a>
<x-import component-from-global-scope="AStra.CreatorSummary" compact="{{ yes }}" name="Jonah Lee" discipline="musician"></x-import>
<x-import component-from-global-scope="AStra.CreatorSummary" compact="{{ yes }}" name="Priya Nair" discipline="writer"></x-import>
<x-import component-from-global-scope="AStra.CreatorSummary" compact="{{ yes }}" name="Nia Brooks" discipline="dancer"></x-import>
<a href="Discover.dc.html" class="as-btn as-btn--quiet as-btn--sm" style="align-self: flex-start">Discover more</a>
</section>
<span class="as-sample">Sample data · fictional accounts</span>
</aside>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":3260}}'>
class Component extends DCLogic {
  renderVals() {
    const s = Object.assign({ f: 'all' }, this.state || {});
    const M = false;
    const F = {Main:['Main','LandingMobile'],SignIn:['SignIn','SignInMobile'],Feed:['Feed','FeedMobile'],Profile:['Profile','ProfileMobile'],Event:['Event','EventMobile'],CollabFind:['CollabFind','CollabFindMobile'],CollabCreate:['CollabCreate','CollabCreateMobile'],CollabRespond:['CollabRespond','CollabRespondMobile'],Checkout:['Checkout','CheckoutMobile'],Loyalty:['Loyalty','LoyaltyMobile'],Dashboard:['Dashboard','DashboardMobile'],Admin:['Admin','AdminMobile']};
    const L = {'AStra':'Main','Feed':'Feed','Discover':'Profile','Favorites':'Profile','Loyalty':'Loyalty','Cart':'Checkout','Orders':'Checkout','Overview':'Dashboard','Home':'Dashboard','Publish':'Dashboard','Community':'CollabFind','Collaborate':'CollabFind','Collab':'CollabFind','Audience insights':'Dashboard','Creator':'Dashboard','Audience':'Feed','Review queue':'Admin','Verification':'Admin','Loyalty rules':'Admin','Commerce disputes':'Admin','Accounts':'Admin','Audit history':'Admin','View event':'Event','Read post':'Profile','View item':'Profile','View opportunity':'CollabRespond','Loyalty history':'Loyalty','Add to cart':'Checkout','Sign in':'SignIn','Join AStra':'SignIn','Explore creators':'Feed','Discover more':'Profile','Create opportunity':'CollabCreate','Find opportunities':'CollabFind','Publish opportunity':'CollabFind','Review responses':'CollabRespond'};
    const X = {};
    const go = (k) => { const a = this._root && this._root.querySelector('a[data-route="' + k + '"]'); if (a) a.click(); };
    const route = (e) => {
      const t = e.target && e.target.closest ? e.target.closest('a,button,.as-logo') : null; if (!t) return;
      const h = t.getAttribute('href'); if (h && h.indexOf('.dc.html') > -1) return; if (h === '#') e.preventDefault();
      this._root = e.currentTarget;
      const NF = {Notifications:['Notifications','NotificationsMobile'],Settings:['Settings','SettingsMobile'],Orders:['Orders','OrdersMobile'],Discover:['Discover','DiscoverMobile'],Onboarding:['Onboarding','OnboardingMobile']};
      const DX = {'Discover':'Discover','Discover more':'Discover','Favorites':'Discover','Favorite creators':'Discover','Find creators':'Discover'};
      const dk = [t.getAttribute('aria-label') || ''].concat([].map.call(t.querySelectorAll('span,strong'), (n) => n.textContent), [t.textContent]).map((v) => (v || '').trim()).filter((v) => DX[v])[0];
      if (dk) { e.preventDefault(); const df = NF[DX[dk]]; const da = document.createElement('a'); da.setAttribute('href', df[M ? 1 : 0] + '.dc.html'); da.style.display = 'none'; this._root.appendChild(da); da.click(); da.remove(); return; }
      const EX = {'Notifications':'Notifications','Settings':'Settings','More':'Settings','Orders':'Orders','Your orders':'Orders','Sign out':'Main','Mira Rao':'Profile','Color After Hours':'Event'};
      const nav = (k) => { const f = F[k] || NF[k]; if (!f) return; const a = document.createElement('a'); a.setAttribute('href', f[M ? 1 : 0] + '.dc.html'); a.style.display = 'none'; this._root.appendChild(a); a.click(); a.remove(); };
      if (t.classList && t.classList.contains('as-account')) { e.preventDefault(); nav(document.title.indexOf('Admin') > -1 ? 'Main' : 'Settings'); return; }
      const cx = [t.getAttribute('aria-label') || ''].concat([].map.call(t.querySelectorAll('span,strong'), (n) => n.textContent));
      for (let i = 0; i < cx.length; i++) { const k = (cx[i] || '').trim().split(',')[0]; if (EX[k]) { e.preventDefault(); nav(EX[k]); return; } }
      const c = [t.getAttribute('aria-label') || ''].concat([].map.call(t.querySelectorAll('span,strong'), (n) => n.textContent), [t.textContent]);
      for (let i = 0; i < c.length; i++) { const k = (c[i] || '').trim(); if (X[k]) { e.preventDefault(); X[k](); return; } if (L[k]) { e.preventDefault(); go(L[k]); return; } }
    };
    const routes = Object.keys(F).map((k) => ({ key: k, file: F[k][M ? 1 : 0] + '.dc.html' }));
    const f = s.f;
    return {
      route, routes, yes: true, no: false, n2: 2, n12: 12, n25: 25, n30: 30, n50: 50, n600: 600,
      fAll: f === 'all', fPost: f === 'post', fEvent: f === 'event', fMerch: f === 'merch',
      pickAll: () => this.setState({ f: 'all' }), pickPost: () => this.setState({ f: 'post' }),
      pickEvent: () => this.setState({ f: 'event' }), pickMerch: () => this.setState({ f: 'merch' }),
      showEvent: f === 'all' || f === 'event', showPost: f === 'all' || f === 'post', showMerch: f === 'all' || f === 'merch'
    };
  }
}
</script>
</body>
</html>
