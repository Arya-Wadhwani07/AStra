<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AStra · Creator menu (mobile)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/astra/tokens.css">
<link rel="stylesheet" href="ds/astra/components/bundle.css">
<script src="ds/astra/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Unbounded";src:url("/_blob/9e2d0308574e0dd739947215fe78be46") format("woff2");font-weight:200 900;font-display:swap}
@font-face{font-family:"Schibsted Grotesk";src:url("/_blob/52f7db2d17ed1151fb5edc419ca9f191") format("woff2");font-weight:400 900;font-display:swap}
@font-face{font-family:"IBM Plex Mono";src:url("/_blob/e44578e499896e30b393535e412478a4") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"IBM Plex Mono";src:url("/_blob/74f0e95277624757400b58c375897663") format("woff2");font-weight:500;font-display:swap}
body{margin:0;background:#0b1430}
a{color:var(--link)}a:hover{color:var(--ink)}
.st-link{display:flex;align-items:center;gap:12px;min-height:60px;padding:6px 14px;border-radius:12px;text-decoration:none;color:var(--ink);font-weight:600;font-size:15px}
.st-link:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.st-link .st-ico{color:var(--ink-muted);display:grid;place-items:center;width:36px;height:36px;border-radius:12px;background:var(--surface-sunken);flex:none}
.st-link .st-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.st-link .st-txt .as-caption{font-weight:400}
.st-link .st-go{margin-left:auto;color:var(--ink-muted);display:grid;place-items:center}
.st-link .cm-count{margin-left:auto;min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:var(--accent);color:var(--bg);font-size:12px;font-weight:700;display:grid;place-items:center}
.st-link .cm-count + .st-go,.st-link .as-badge + .st-go{margin-left:0}
.cm-group{padding:6px;display:flex;flex-direction:column;gap:2px}
.cm-head{margin:4px 4px 0;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-subtle);font-weight:600}
</style>
</helmet>
<div onClick="{{ route }}" data-theme="glass" class="as-shell as-shell--mobile" style="width: 390px; height: 1520px; font-family: var(--font-sans); color: var(--ink); background: var(--bg); overflow: hidden">
<nav aria-hidden="true" style="display: none"><sc-for list="{{ routes }}" as="r" hint-placeholder-count="12"><a href="{{ r.file }}" data-route="{{ r.key }}" tabindex="-1">{{ r.key }}</a></sc-for></nav>
<div class="as-ambient" aria-hidden="true"><span class="as-ambient__blob as-ambient__blob--1"></span><span class="as-ambient__blob as-ambient__blob--2"></span><span class="as-ambient__blob as-ambient__blob--3"></span><span class="as-ambient__blob as-ambient__blob--4"></span><span class="as-ambient__grain"></span></div>
<x-import component-from-global-scope="AStra.TopBar" mobile="{{ yes }}" role="creator"></x-import>
<div class="as-shell__mtitle"><h1 class="as-page-title">More</h1></div>
<main class="as-shell__main">
<section class="as-card" style="display: flex; flex-direction: column; gap: 14px">
<x-import component-from-global-scope="AStra.CreatorSummary" compact="{{ yes }}" name="Mira Rao" discipline="painter" location="Los Angeles" verified="{{ yes }}"></x-import>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px">
<a href="ProfileEditMobile.dc.html" class="as-btn as-btn--secondary as-btn--sm">Edit profile</a>
<a href="ProfileMobile.dc.html" class="as-btn as-btn--quiet as-btn--sm">View public profile</a>
</div>
</section>
<section class="as-card" style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-direction: column; gap: 2px"><strong style="font-size: 15px">You’re browsing as a creator</strong><span class="as-caption">Switch to Audience to see your feed, cart and points.</span></div>
<x-import component-from-global-scope="AStra.RoleSwitch" role="creator"></x-import>
</section>
<p class="cm-head">Your work</p>
<nav class="as-card cm-group" aria-label="Creator tools">
<sc-for list="{{ work }}" as="l" hint-placeholder-count="5">
<a href="{{ l.href }}" class="st-link"><span class="st-ico"><x-import component-from-global-scope="AStra.Icon" name="{{ l.icon }}" size="{{ n20 }}"></x-import></span><span class="st-txt"><span>{{ l.label }}</span><span class="as-caption">{{ l.sub }}</span></span><sc-if value="{{ l.hasCount }}" hint-placeholder-val="{{ false }}"><span class="cm-count" aria-label="2 unread">{{ l.count }}</span></sc-if><sc-if value="{{ l.hasBadge }}" hint-placeholder-val="{{ false }}"><x-import component-from-global-scope="AStra.StatusBadge" tone="success">{{ l.badge }}</x-import></sc-if><span class="st-go"><x-import component-from-global-scope="AStra.Icon" name="caret-right" size="{{ n16 }}"></x-import></span></a>
</sc-for>
</nav>
<p class="cm-head">Account</p>
<nav class="as-card cm-group" aria-label="Account">
<sc-for list="{{ account }}" as="l" hint-placeholder-count="5">
<a href="{{ l.href }}" class="st-link"><span class="st-ico"><x-import component-from-global-scope="AStra.Icon" name="{{ l.icon }}" size="{{ n20 }}"></x-import></span><span class="st-txt"><span>{{ l.label }}</span><span class="as-caption">{{ l.sub }}</span></span><sc-if value="{{ l.hasCount }}" hint-placeholder-val="{{ false }}"><span class="cm-count" aria-label="2 unread">{{ l.count }}</span></sc-if><sc-if value="{{ l.hasBadge }}" hint-placeholder-val="{{ false }}"><x-import component-from-global-scope="AStra.StatusBadge" tone="success">{{ l.badge }}</x-import></sc-if><span class="st-go"><x-import component-from-global-scope="AStra.Icon" name="caret-right" size="{{ n16 }}"></x-import></span></a>
</sc-for>
</nav>
<a href="LandingMobile.dc.html" class="as-btn as-btn--secondary as-btn--lg as-btn--full"><span style="display: inline-flex; gap: 8px; align-items: center"><x-import component-from-global-scope="AStra.Icon" name="sign-out" size="{{ n18 }}"></x-import><span>Sign out</span></span></a>
<span class="as-sample" style="align-self: flex-start">Sample data</span>
</main>
<x-import component-from-global-scope="AStra.BottomNav" role="creator" active="none"></x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1520}}'>
class Component extends DCLogic {
  renderVals() {
    const M = true;
    /*ROUTES:creator*/
    const P = {Main:['Main','LandingMobile'],SignIn:['SignIn','SignInMobile'],Onboarding:['Onboarding','OnboardingMobile'],Feed:['Feed','FeedMobile'],Discover:['Discover','DiscoverMobile'],Profile:['Profile','ProfileMobile'],Event:['Event','EventMobile'],Checkout:['Checkout','CheckoutMobile'],Loyalty:['Loyalty','LoyaltyMobile'],Orders:['Orders','OrdersMobile'],Notifications:['Notifications','NotificationsMobile'],Settings:['Settings','SettingsMobile'],Dashboard:['Dashboard','DashboardMobile'],CollabFind:['CollabFind','CollabFindMobile'],CollabCreate:['CollabCreate','CollabCreateMobile'],CollabRespond:['CollabRespond','CollabRespondMobile'],Admin:['Admin','AdminMobile'],CreatorSetup:['CreatorSetup','CreatorSetupMobile'],ProfileEdit:['ProfileEdit','ProfileEditMobile'],Publish:['Publish','PublishMobile'],Insights:['Insights','InsightsMobile'],CreatorOrders:['CreatorOrders','CreatorOrdersMobile'],CreatorLoyalty:['CreatorLoyalty','CreatorLoyaltyMobile'],Community:['Community','CommunityMobile'],MyCollabs:['MyCollabs','MyCollabsMobile'],Messages:['Messages','MessagesMobile'],CreatorMenu:['Dashboard','CreatorMenuMobile']};
    const L = {AStra:'Main','Sign out':'Main',Notifications:'Notifications',Settings:'Settings','Sign in':'SignIn','Join AStra':'SignIn',Overview:'Dashboard',Home:'Dashboard',Publish:'Publish',Community:'Community',Collaborate:'CollabFind',Collab:'CollabFind','Audience insights':'Insights',Insights:'Insights',Loyalty:'CreatorLoyalty',Orders:'CreatorOrders',More:'CreatorMenu',Audience:'Feed',Creator:'Dashboard',Messages:'Messages','My collaborations':'MyCollabs','Find opportunities':'CollabFind','Create opportunity':'CollabCreate','View opportunity':'CollabRespond','Review responses':'MyCollabs','Edit profile':'ProfileEdit','View public profile':'Profile',Verification:'CreatorSetup'};
    const ACCOUNT = 'ProfileEdit';
    /*END ROUTES*/
    const X = { 'More': () => {} };
    /*ROUTER*/
    const nav = (k) => { const f = P[k]; if (!f || !this._root) return; const a = document.createElement('a'); a.setAttribute('href', f[M ? 1 : 0] + '.dc.html'); a.style.display = 'none'; this._root.appendChild(a); a.click(); a.remove(); };
    const go = nav;
    const route = (e) => {
      const t = e.target && e.target.closest ? e.target.closest('a,button,.as-logo') : null; if (!t) return;
      this._root = e.currentTarget;
      const h = t.getAttribute('href'); if (h && h.indexOf('.dc.html') > -1) return; if (h && h.charAt(0) === '#') e.preventDefault();

      const local = !!(t.closest && t.closest('[data-local]'));
      const c = [(t.getAttribute('aria-label') || '').split(',')[0]].concat([].map.call(t.querySelectorAll('span,strong'), (n) => n.textContent), [t.textContent]).map((v) => (v || '').trim()).filter((v) => v);
      for (let i = 0; i < c.length; i++) { if (X[c[i]]) { e.preventDefault(); X[c[i]](); return; } }
      if (local) return;
      for (let i = 0; i < c.length; i++) { if (L[c[i]]) { e.preventDefault(); nav(L[c[i]]); return; } }
    };
    const routes = Object.keys(P).map((k) => ({ key: k, file: P[k][M ? 1 : 0] + '.dc.html' }));
    /*END ROUTER*/
    const it = (label, sub, icon, href, extra) => Object.assign({ label, sub, icon, href: href + '.dc.html', hasCount: false, count: 0, hasBadge: false, badge: '' }, extra || {});
    return {
      route, routes, yes: true, no: false, n16: 16, n18: 18, n20: 20,
      work: [
        it('Audience insights', 'Followers and interest, measured on AStra', 'chart-line-up', 'InsightsMobile'),
        it('Loyalty and points limit', 'Your 20% cap on points discounts', 'star-four', 'CreatorLoyaltyMobile'),
        it('Orders', 'Tickets and prints people bought', 'receipt', 'CreatorOrdersMobile'),
        it('Messages', 'Private to you and each participant', 'chat-circle-text', 'MessagesMobile', { hasCount: true, count: 2 }),

      account: [

        it('Settings', 'Account, privacy and data', 'gear-six', 'SettingsMobile')
      ]
    };
  }
}
</script>
</body>
</html>
