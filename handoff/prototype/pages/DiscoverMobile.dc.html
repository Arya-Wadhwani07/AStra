<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AStra · Discover creators (mobile)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/astra/tokens.css">
<link rel="stylesheet" href="ds/astra/components/bundle.css">
<script src="ds/astra/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Unbounded";src:url("/_blob/9e2d0308574e0dd739947215fe78be46") format("woff2");font-weight:200 900;font-display:swap}
@font-face{font-family:"Schibsted Grotesk";src:url("/_blob/52f7db2d17ed1151fb5edc419ca9f191") format("woff2");font-weight:400 900;font-display:swap}
@font-face{font-family:"IBM Plex Mono";src:url("/_blob/e44578e499896e30b393535e412478a4") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"IBM Plex Mono";src:url("/_blob/74f0e95277624757400b58c375897663") format("woff2");font-weight:500;font-display:swap}
body{margin:0;background:#0b1430}
a{color:var(--link)}a:hover{color:var(--ink)}
.dv-row{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-items:center;padding:12px}
.dv-fav{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:12px;font:600 14px/20px var(--font-sans);cursor:pointer;border:1px solid var(--border-strong);background:var(--glass-fill);color:var(--ink)}
.dv-fav[aria-pressed="true"]{background:var(--action);color:var(--on-action);border-color:var(--action-edge)}
.dv-fav:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.dv-chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
</style>
</helmet>
<div onClick="{{ route }}" data-theme="glass" class="as-shell as-shell--mobile" style="width: 390px; height: 2200px; font-family: var(--font-sans); color: var(--ink); background: var(--bg); overflow: hidden">
<nav aria-hidden="true" style="display: none"><sc-for list="{{ routes }}" as="r" hint-placeholder-count="12"><a href="{{ r.file }}" data-route="{{ r.key }}" tabindex="-1">{{ r.key }}</a></sc-for></nav>
<div class="as-ambient as-ambient--drift" aria-hidden="true"><span class="as-ambient__blob as-ambient__blob--1"></span><span class="as-ambient__blob as-ambient__blob--2"></span><span class="as-ambient__blob as-ambient__blob--3"></span><span class="as-ambient__blob as-ambient__blob--4"></span><span class="as-ambient__grain"></span></div>
<x-import component-from-global-scope="AStra.TopBar" mobile="{{ yes }}" role="audience"></x-import>
<div class="as-shell__mtitle"><h1 class="as-page-title">Discover</h1></div>
<main class="as-shell__main">
<x-import component-from-global-scope="AStra.SearchField" placeholder="Name, discipline or city" size="lg"></x-import>
<div class="dv-chips">
<sc-for list="{{ chips }}" as="c" hint-placeholder-count="8">
<x-import component-from-global-scope="AStra.Chip" interactive="{{ yes }}" selected="{{ c.sel }}" on-click="{{ c.pick }}">{{ c.label }}</x-import>
</sc-for>
</div>
<div class="as-neu-tile" style="flex-direction: row; align-items: center; justify-content: space-between">
<span>Your favorites</span><strong style="font-size: 18px">{{ favCount }}</strong>
</div>
<sc-for list="{{ shown }}" as="p" hint-placeholder-count="6">
<article class="as-card dv-row">
<x-import component-from-global-scope="AStra.MediaFrame" ratio="1:1" art="{{ p.art }}" discipline="{{ p.disc }}"></x-import>
<div style="display: flex; flex-direction: column; gap: 8px; min-width: 0">
<x-import component-from-global-scope="AStra.CreatorSummary" compact="{{ yes }}" name="{{ p.name }}" discipline="{{ p.disc }}" verified="{{ p.verified }}"></x-import>
<div style="display: flex; gap: 8px; align-items: center">
<button type="button" class="dv-fav" aria-pressed="{{ p.favAttr }}" onClick="{{ p.toggle }}">{{ p.favLabel }}</button>
<sc-if value="{{ p.hasProfile }}" hint-placeholder-val="{{ false }}"><a href="ProfileMobile.dc.html" class="as-btn as-btn--quiet as-btn--sm" style="min-height: 44px">Profile</a></sc-if>
</div>
</div>
</article>
</sc-for>
<sc-if value="{{ none }}" hint-placeholder-val="{{ false }}">
<x-import component-from-global-scope="AStra.EmptyState" tone="noresults" title="No creators here yet" body="Try another discipline." compact="{{ yes }}"></x-import>
</sc-if>
<a href="FeedMobile.dc.html" class="as-btn as-btn--primary as-btn--lg as-btn--full">Go to my feed</a>
<span class="as-sample">Sample data · only Mira’s profile is built</span>
</main>
<x-import component-from-global-scope="AStra.BottomNav" role="audience" active="discover" cart-count="{{ n1 }}"></x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":2200}}'>
class Component extends DCLogic {
  renderVals() {
    const s = Object.assign({ f: 'all', fav: { mira: true, jonah: true, priya: true, nia: true } }, this.state || {});
    const M = true;
    const F = {Main:['Main','LandingMobile'],SignIn:['SignIn','SignInMobile'],Feed:['Feed','FeedMobile'],Profile:['Profile','ProfileMobile'],Event:['Event','EventMobile'],CollabFind:['CollabFind','CollabFindMobile'],CollabCreate:['CollabCreate','CollabCreateMobile'],CollabRespond:['CollabRespond','CollabRespondMobile'],Checkout:['Checkout','CheckoutMobile'],Loyalty:['Loyalty','LoyaltyMobile'],Dashboard:['Dashboard','DashboardMobile'],Admin:['Admin','AdminMobile']};
    const NF = {Notifications:['Notifications','NotificationsMobile'],Settings:['Settings','SettingsMobile'],Orders:['Orders','OrdersMobile'],Discover:['Discover','DiscoverMobile']};
    const L = {'AStra':'Main','Feed':'Feed','Loyalty':'Loyalty','Cart':'Checkout','Notifications':'Notifications','More':'Settings'};
    const route = (e) => {
      const t = e.target && e.target.closest ? e.target.closest('a,button,.as-logo') : null; if (!t) return;
      if (t.classList && (t.classList.contains('dv-fav') || t.classList.contains('as-chip'))) return;
      const h = t.getAttribute('href'); if (h && h.indexOf('.dc.html') > -1) return; if (h === '#') e.preventDefault();
      this._root = e.currentTarget;
      const nav = (k) => { const f = F[k] || NF[k]; if (!f) return; const a = document.createElement('a'); a.setAttribute('href', f[M ? 1 : 0] + '.dc.html'); a.style.display = 'none'; this._root.appendChild(a); a.click(); a.remove(); };
      const cx = [t.getAttribute('aria-label') || ''].concat([].map.call(t.querySelectorAll('span,strong'), (n) => n.textContent), [t.textContent]);
      for (let i = 0; i < cx.length; i++) { const k = (cx[i] || '').trim().split(',')[0]; if (L[k]) { e.preventDefault(); nav(L[k]); return; } }
    };
    const routes = Object.keys(F).map((k) => ({ key: k, file: F[k][M ? 1 : 0] + '.dc.html' }));
    const people = [
      { id: 'mira', name: 'Mira Rao', disc: 'painter', art: 'painting', verified: true, profile: true },
      { id: 'eli', name: 'Eli Chen', disc: 'video', art: 'reel', verified: false },
      { id: 'sam', name: 'Sam Ortiz', disc: 'photographer', art: 'prism', verified: true },
      { id: 'jonah', name: 'Jonah Lee', disc: 'musician', art: 'chrome', verified: false },
      { id: 'nia', name: 'Nia Brooks', disc: 'dancer', art: 'dance', verified: false },
      { id: 'priya', name: 'Priya Nair', disc: 'writer', art: 'print', verified: false },
      { id: 'dana', name: 'Dana Kim', disc: 'educator', art: 'event', verified: true }
    ];
    const toggle = (id) => () => { const fav = Object.assign({}, s.fav); fav[id] = !fav[id]; this.setState({ fav }); };
    const chipDefs = [['all', 'All'], ['painter', 'Painters'], ['musician', 'Musicians'], ['dancer', 'Dancers'], ['writer', 'Writers'], ['photographer', 'Photographers'], ['video', 'Video'], ['educator', 'Educators']];
    const shown = people.filter((p) => s.f === 'all' || p.disc === s.f).map((p) => Object.assign({}, p, {
      favAttr: s.fav[p.id] ? 'true' : 'false', favLabel: s.fav[p.id] ? 'Favorited' : 'Favorite', toggle: toggle(p.id), hasProfile: !!p.profile
    }));
    return {
      route, routes, yes: true, n1: 1,
      chips: chipDefs.map((c) => ({ label: c[1], sel: s.f === c[0], pick: () => this.setState({ f: c[0] }) })),
      shown, none: shown.length === 0,
      favCount: people.filter((p) => s.fav[p.id]).length
    };
  }
}
</script>
</body>
</html>
