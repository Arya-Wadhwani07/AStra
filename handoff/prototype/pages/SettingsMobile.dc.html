<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AStra · Menu and settings (mobile)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/astra/tokens.css">
<link rel="stylesheet" href="ds/astra/components/bundle.css">
<script src="ds/astra/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Unbounded";src:url("/_blob/9e2d0308574e0dd739947215fe78be46") format("woff2");font-weight:200 900;font-display:swap}
@font-face{font-family:"Schibsted Grotesk";src:url("/_blob/52f7db2d17ed1151fb5edc419ca9f191") format("woff2");font-weight:400 900;font-display:swap}
@font-face{font-family:"IBM Plex Mono";src:url("/_blob/e44578e499896e30b393535e412478a4") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"IBM Plex Mono";src:url("/_blob/74f0e95277624757400b58c375897663") format("woff2");font-weight:500;font-display:swap}
body{margin:0;background:#0b1430}
a{color:var(--link)}a:hover{color:var(--ink)}
.st-link{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 14px;border-radius:12px;text-decoration:none;color:var(--ink);font-weight:600;font-size:15px}
.st-link:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.st-link .st-ico{color:var(--ink-muted);display:grid;place-items:center}
.st-link .st-go{margin-left:auto;color:var(--ink-muted);display:grid;place-items:center}
</style>
</helmet>
<div onClick="{{ route }}" data-theme="glass" class="as-shell as-shell--mobile" style="width: 390px; height: 1900px; font-family: var(--font-sans); color: var(--ink); background: var(--bg); overflow: hidden">
<nav aria-hidden="true" style="display: none"><sc-for list="{{ routes }}" as="r" hint-placeholder-count="12"><a href="{{ r.file }}" data-route="{{ r.key }}" tabindex="-1">{{ r.key }}</a></sc-for></nav>
<div class="as-ambient" aria-hidden="true"><span class="as-ambient__blob as-ambient__blob--1"></span><span class="as-ambient__blob as-ambient__blob--2"></span><span class="as-ambient__blob as-ambient__blob--3"></span><span class="as-ambient__blob as-ambient__blob--4"></span><span class="as-ambient__grain"></span></div>
<x-import component-from-global-scope="AStra.TopBar" mobile="{{ yes }}" role="audience"></x-import>
<div class="as-shell__mtitle"><h1 class="as-page-title">Menu</h1></div>
<main class="as-shell__main">
<section class="as-card" style="display: flex; align-items: center; gap: 14px; padding: 16px">
<x-import component-from-global-scope="AStra.Avatar" name="Alex Morgan" size="{{ n56 }}"></x-import>
<div style="display: flex; flex-direction: column; gap: 2px"><strong style="font-size: 17px">Alex Morgan</strong><span class="as-caption">Audience account · 100 pts available</span></div>
</section>
<nav class="as-card" aria-label="Menu" style="padding: 6px; display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{ links }}" as="l" hint-placeholder-count="8">
<a href="{{ l.href }}" class="st-link"><span class="st-ico"><x-import component-from-global-scope="AStra.Icon" name="{{ l.icon }}" size="{{ n20 }}"></x-import></span>{{ l.label }}<span class="st-go"><x-import component-from-global-scope="AStra.Icon" name="caret-right" size="{{ n16 }}"></x-import></span></a>
</sc-for>
</nav>
<section class="as-card" style="display: flex; flex-direction: column; gap: 14px">
<h2 class="as-section-title" style="font-size: 18px">Notifications</h2>
<x-import component-from-global-scope="AStra.Switch" label="Posts and events from favorites" default-checked="{{ yes }}"></x-import>
<x-import component-from-global-scope="AStra.Switch" label="Points activity" default-checked="{{ yes }}"></x-import>
<x-import component-from-global-scope="AStra.Switch" label="Order and security notices" description="Always on." checked="{{ yes }}" disabled="{{ yes }}"></x-import>
</section>
<section class="as-card" style="display: flex; flex-direction: column; gap: 12px">
<h2 class="as-section-title" style="font-size: 18px">Privacy and data</h2>
<sc-if value="{{ notRequested }}" hint-placeholder-val="{{ true }}">
<x-import component-from-global-scope="AStra.Button" variant="destructive" size="lg" full-width="{{ yes }}">Request account deletion</x-import>
</sc-if>
<sc-if value="{{ requested }}" hint-placeholder-val="{{ false }}">
<x-import component-from-global-scope="AStra.Banner" tone="warning" title="Deletion requested">Check your email to confirm. Nothing is deleted until you do. (Demo)</x-import>
</sc-if>
</section>
<a href="LandingMobile.dc.html" class="as-btn as-btn--secondary as-btn--lg as-btn--full">Sign out</a>
<span class="as-sample">Sample data</span>
</main>
<x-import component-from-global-scope="AStra.BottomNav" role="audience" active="none"></x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1900}}'>
class Component extends DCLogic {
  renderVals() {
    const s = Object.assign({ requested: false }, this.state || {});
    const M = true;
    const F = {Main:['Main','LandingMobile'],SignIn:['SignIn','SignInMobile'],Feed:['Feed','FeedMobile'],Profile:['Profile','ProfileMobile'],Event:['Event','EventMobile'],CollabFind:['CollabFind','CollabFindMobile'],CollabCreate:['CollabCreate','CollabCreateMobile'],CollabRespond:['CollabRespond','CollabRespondMobile'],Checkout:['Checkout','CheckoutMobile'],Loyalty:['Loyalty','LoyaltyMobile'],Dashboard:['Dashboard','DashboardMobile'],Admin:['Admin','AdminMobile']};
    const L = {'AStra':'Main','Feed':'Feed','Discover':'Profile','Loyalty':'Loyalty','Cart':'Checkout'};
    const X = { 'Request account deletion': () => this.setState({ requested: true }), 'More': () => {} };
    const go = (k) => { const a = this._root && this._root.querySelector('a[data-route="' + k + '"]'); if (a) a.click(); };
    const route = (e) => {
      const t = e.target && e.target.closest ? e.target.closest('a,button,.as-logo') : null; if (!t) return;
      const h = t.getAttribute('href'); if (h && h.indexOf('.dc.html') > -1) return; if (h === '#') e.preventDefault();
      this._root = e.currentTarget;
      const NF = {Notifications:['Notifications','NotificationsMobile'],Settings:['Settings','SettingsMobile'],Orders:['Orders','OrdersMobile'],Discover:['Discover','DiscoverMobile'],Onboarding:['Onboarding','OnboardingMobile']};
      const DX = {'Discover':'Discover','Discover more':'Discover','Favorites':'Discover','Favorite creators':'Discover','Find creators':'Discover'};
      const dk = [t.getAttribute('aria-label') || ''].concat([].map.call(t.querySelectorAll('span,strong'), (n) => n.textContent), [t.textContent]).map((v) => (v || '').trim()).filter((v) => DX[v])[0];
      if (dk) { e.preventDefault(); const df = NF[DX[dk]]; const da = document.createElement('a'); da.setAttribute('href', df[M ? 1 : 0] + '.dc.html'); da.style.display = 'none'; this._root.appendChild(da); da.click(); da.remove(); return; }
      const EX = {'Notifications':'Notifications','Orders':'Orders'};
      const nav = (k) => { const f = F[k] || NF[k]; if (!f) return; const a = document.createElement('a'); a.setAttribute('href', f[M ? 1 : 0] + '.dc.html'); a.style.display = 'none'; this._root.appendChild(a); a.click(); a.remove(); };
      const cx = [t.getAttribute('aria-label') || ''].concat([].map.call(t.querySelectorAll('span,strong'), (n) => n.textContent), [t.textContent]);
      for (let i = 0; i < cx.length; i++) { const k = (cx[i] || '').trim().split(',')[0]; if (X[k]) { e.preventDefault(); X[k](); return; } if (EX[k]) { e.preventDefault(); nav(EX[k]); return; } if (L[k]) { e.preventDefault(); nav(L[k]); return; } }
    };
    const routes = Object.keys(F).map((k) => ({ key: k, file: F[k][M ? 1 : 0] + '.dc.html' }));
    return {
      route, routes, yes: true, n16: 16, n20: 20, n56: 56,
      requested: s.requested, notRequested: !s.requested,
      links: [
        { label: 'Your orders', icon: 'receipt', href: 'OrdersMobile.dc.html' },
        { label: 'Notifications', icon: 'bell', href: 'NotificationsMobile.dc.html' },
        { label: 'Loyalty history', icon: 'star-four', href: 'LoyaltyMobile.dc.html' },
        { label: 'Favorite creators', icon: 'heart', href: 'DiscoverMobile.dc.html' },
        { label: 'Discover creators', icon: 'compass', href: 'DiscoverMobile.dc.html' },
        { label: 'Creator view (demo as Mira)', icon: 'palette', href: 'DashboardMobile.dc.html' },
        { label: 'Collaboration (demo as Eli)', icon: 'handshake', href: 'CollabFindMobile.dc.html' },
        { label: 'Admin demo', icon: 'shield-check', href: 'AdminMobile.dc.html' }
      ]
    };
  }
}
</script>
</body>
</html>
