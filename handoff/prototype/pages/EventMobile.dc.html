<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AStra · Color After Hours (mobile)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/astra/tokens.css">
<link rel="stylesheet" href="ds/astra/components/bundle.css">
<script src="ds/astra/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Unbounded";src:url("/_blob/9e2d0308574e0dd739947215fe78be46") format("woff2");font-weight:200 900;font-display:swap}
@font-face{font-family:"Schibsted Grotesk";src:url("/_blob/52f7db2d17ed1151fb5edc419ca9f191") format("woff2");font-weight:400 900;font-display:swap}
@font-face{font-family:"IBM Plex Mono";src:url("/_blob/e44578e499896e30b393535e412478a4") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"IBM Plex Mono";src:url("/_blob/74f0e95277624757400b58c375897663") format("woff2");font-weight:500;font-display:swap}
body{margin:0;background:#0b1430}
a{color:var(--link)}a:hover{color:var(--ink)}
</style>
</helmet>
<div onClick="{{ route }}" data-theme="glass" class="as-shell as-shell--mobile" style="width: 390px; height: 1700px; font-family: var(--font-sans); color: var(--ink); background: var(--bg); overflow: hidden">
<nav aria-hidden="true" style="display: none"><sc-for list="{{ routes }}" as="r" hint-placeholder-count="12"><a href="{{ r.file }}" data-route="{{ r.key }}" tabindex="-1">{{ r.key }}</a></sc-for></nav>
<div class="as-ambient as-ambient--drift" aria-hidden="true"><span class="as-ambient__blob as-ambient__blob--1"></span><span class="as-ambient__blob as-ambient__blob--2"></span><span class="as-ambient__blob as-ambient__blob--3"></span><span class="as-ambient__blob as-ambient__blob--4"></span><span class="as-ambient__grain"></span></div>
<x-import component-from-global-scope="AStra.TopBar" mobile="{{ yes }}" role="audience"></x-import>
<main class="as-shell__main" style="padding-top: 16px">
<a href="FeedMobile.dc.html" style="font-size: 14px; font-weight: 600; min-height: 44px; display: flex; align-items: center">Back to feed</a>
<x-import component-from-global-scope="AStra.MediaFrame" ratio="16:9" art="event" credit="Placeholder art"></x-import>
<p style="margin: 0; color: var(--accent-ink); font-weight: 600; font-size: 14px">Sat, Oct 10, 6-8 PM PT · Los Angeles</p>
<h1 style="margin: 0; font-family: var(--font-display); font-size: 30px; line-height: 1.1; letter-spacing: -0.015em; font-weight: 600">Color After Hours</h1>
<p style="margin: 0; font-size: 15px; line-height: 22px; color: var(--ink-muted)">A small evening show of new color-field paintings by Mira Rao. Prints available at the door.</p>
<x-import component-from-global-scope="AStra.CreatorSummary" card="{{ yes }}" name="Mira Rao" discipline="painter" location="Los Angeles" verified="{{ yes }}" favorite="{{ yes }}"></x-import>
<section class="as-card" style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; justify-content: space-between">
<x-import component-from-global-scope="AStra.PriceTag" amount="{{ n25 }}" unit="ticket" size="lg"></x-import>
<x-import component-from-global-scope="AStra.AvailabilityLabel" status="available"></x-import>
</div>
<div style="display: flex; align-items: center; justify-content: space-between">
<span class="as-label">Quantity</span>
<x-import component-from-global-scope="AStra.QuantityStepper" value="{{ n1 }}" max="{{ n4 }}" item="Color After Hours ticket" interactive="{{ yes }}"></x-import>
</div>
<div style="display: flex; gap: 8px; padding: 12px; border-radius: 12px; background: var(--points-bg)">
<span style="color: var(--points); flex: none"><x-import component-from-global-scope="AStra.Icon" name="star-four" weight="fill" size="{{ n20 }}"></x-import></span>
<p style="margin: 0; font-size: 14px; line-height: 20px">Up to <strong>20% off</strong> with points: up to 500 pts = $5.00 per ticket.</p>
</div>
<a href="CheckoutMobile.dc.html" class="as-btn as-btn--primary as-btn--lg as-btn--full">Add to cart</a>
</section>
<span class="as-sample">Sample data · demo checkout</span>
</main>
<x-import component-from-global-scope="AStra.BottomNav" role="audience" active="feed" cart-count="{{ n1 }}"></x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1700}}'>

</body>
</html>
