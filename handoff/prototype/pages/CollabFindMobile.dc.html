<!doctype html>

<script src="./support.js"></script>
<link rel="stylesheet" href="ds/astra/tokens.css">

<body>
<x-dc>
<helmet>
<style>

<div class="as-ambient as-ambient--drift" aria-hidden="true"><span class="as-ambient__blob as-ambient__blob--1"></span><span class="as-ambient__blob as-ambient__blob--2"></span><span class="as-ambient__blob as-ambient__blob--3"></span><span class="as-ambient__blob as-ambient__blob--4"></span><span class="as-ambient__grain"></span></div>

<x-import component-from-global-scope="AStra.Chip" interactive="{{ yes }}" selected="{{ fOpen }}" on-click="{{ toggleOpen }}">Accepting responses</x-import>

<span class="as-sample">Sample data</span>
<x-import component-from-global-scope="AStra.OpportunityCard" title="Help turn my exhibition into a 30-second launch reel" poster="Mira Rao" poster-discipline="painter" verified="{{ yes }}" discipline="video" deliverable="30-second launch reel" timing="Two weeks" remote="{{ yes }}" arrangement="paid" budget="$150" criteria="{{ critA }}" responses="{{ n8 }}" limit="{{ n10 }}" status="open"></x-import>
<sc-if value="{{ showC }}" hint-placeholder-val="{{ true }}">
<x-import component-from-global-scope="AStra.OpportunityCard" title="Behind-the-scenes cut for a portrait series" poster="Sam Ortiz" poster-discipline="photographer" discipline="video" deliverable="2-minute BTS film" timing="October" remote="{{ yes }}" arrangement="open" criteria="{{ critC }}" responses="{{ n2 }}" limit="{{ n10 }}" status="open"></x-import>
</sc-if>
<sc-if value="{{ showB }}" hint-placeholder-val="{{ true }}">
<x-import component-from-global-scope="AStra.OpportunityCard" title="Choreograph a 60-second section of my next music video" poster="Jonah Lee" poster-discipline="musician" discipline="dancer" deliverable="Choreography + one filmed take" timing="Three weeks" location="Los Angeles" arrangement="revenue" criteria="{{ critB }}" responses="{{ n3 }}" limit="{{ n5 }}" status="open"></x-import>
</sc-if>
<sc-if value="{{ showD }}" hint-placeholder-val="{{ true }}">
<x-import component-from-global-scope="AStra.OpportunityCard" title="Cover art for a poetry chapbook" poster="Priya Nair" poster-discipline="writer" discipline="painter" deliverable="One cover painting" timing="Four weeks" remote="{{ yes }}" arrangement="exchange" criteria="{{ critD }}" responses="{{ n20 }}" limit="{{ n20 }}" status="paused"></x-import>
</sc-if>
</main>
<x-import component-from-global-scope="AStra.BottomNav" role="creator" active="collaborate"></x-import>
</div>
</x-dc>

</body>
</html>
